org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# AGP 9+ بقى عنده Kotlin مدمج ("built-in Kotlin"), وبقى شرط إنك ما تطبّقش
# بلجن kotlin-android القديم (اللي لسه مستخدمينه في app/build.gradle مع
# kotlinOptions) إلا لو العلمين دول موجودين — فلاتر بتضيفهم تلقائي عادةً،
# بس بنثبّتهم هنا صراحة عشان بيئة الـ CI متجددة (checkout جديد) في كل مرة
# ومنعتمدش على إن الأداة تضيفهم قبل ما Gradle يشتغل. المرجع الرسمي:
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.newDsl=false
android.builtInKotlin=false
